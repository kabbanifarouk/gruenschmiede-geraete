<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#edefe9">
<title>Keine Verbindung · Grünschmiede</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
         background: #edefe9; color: #17201b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; }
  img { width: 120px; margin: 0 auto 24px; display: block; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #4c5952; margin: 0 0 24px; line-height: 1.5; max-width: 320px; }
  button { height: 48px; padding: 0 22px; border: 0; border-radius: 13px; background: #1e3b2c; color: #fff; font-size: 16px; font-weight: 600; }
</style>
</head>
<body>
  <main>
    <img src="/logo.png" alt="">
    <h1>Keine Internetverbindung</h1>
    <p>Die App braucht Netz, damit alle im Team denselben Stand sehen. Sobald du wieder Empfang hast, geht es weiter.</p>
    <button onclick="location.reload()">Erneut versuchen</button>
  </main>
</body>
</html>
